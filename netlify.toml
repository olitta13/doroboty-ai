# Publikacja prototypu DoRoboty.ai na Netlify.
# Aplikacja jest statyczna: bez serwera, bazy danych i kluczy API,
# więc nie wymaga żadnych zmiennych środowiskowych.

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
